[project]
name = "quran-wird-bot"
version = "0.1.0"
description = "بوت تيليجرام للورد اليومي من القرآن الكريم"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue,rate-limiter]>=22.0,<23.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quran_wird"]

[tool.ruff]
line-length = 100
target-version = "py311"
# هجرات Alembic مولّدة آليًا — لا تُنسّق يدويًا
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
